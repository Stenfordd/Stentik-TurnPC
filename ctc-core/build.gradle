plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '0.7.0'
group = 'dev.stentik.ctccore'
base { archivesName = 'ctccore' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.200'
    mods {
        ctccore {
            sourceSet sourceSets.main
        }
    }
    runs {
        // CI boots a headless game-test server once: catches registry, mixin and event crashes before players do
        gameTestServer {
            type = "gameTestServer"
        }
    }
}

dependencies {
    // Ponder API for the scenes; the jar is taken out of Create by the workflow (it is part of Create at runtime)
    compileOnly files('libs/ponder.jar')
    // JEI for the Where to find tab, downloaded by the workflow
    compileOnly files('libs/jei.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
