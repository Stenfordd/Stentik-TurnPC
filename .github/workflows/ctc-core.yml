name: Build CtC Core
# Zkompiluje mod ctc-core a hotový jar uloží do download/ctccore.jar (odtud si ho stahuje installer).
on:
  push:
    paths:
      - 'ctc-core/**'
      - '.github/workflows/ctc-core.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ponder library (taken out of Create, only for compiling)
        run: |
          mkdir -p ctc-core/libs tmp-ponder
          url=$(curl -fsSL 'https://api.modrinth.com/v2/project/create/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D' | jq -r '[.[0].files[] | select(.primary)][0].url')
          curl -fsSL "$url" -o tmp-ponder/create.jar
          unzip -j -o tmp-ponder/create.jar 'META-INF/jarjar/ponder-neoforge-*.jar' -d tmp-ponder
          mv tmp-ponder/ponder-neoforge-*.jar ctc-core/libs/ponder.jar
          rm -rf tmp-ponder
      - name: Build
        working-directory: ctc-core
        run: gradle build --no-daemon --stacktrace
      - name: Uložit jar
        run: |
          mkdir -p download
          cp ctc-core/build/libs/ctccore-*.jar download/ctccore.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/ctccore.jar
          git diff --cached --quiet || (git commit -m "CtC Core: build" && git pull --rebase -q && git push)
